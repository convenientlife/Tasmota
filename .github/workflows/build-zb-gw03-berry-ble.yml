name: Build ZB-GW03 (Zigbee + BLE + Berry BLE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      # ── 1. No Key Found 콘솔 도배 차단 ─────────────────────
      - name: Mute No Key Found (xsns_62_esp32_mi_ble.ino)
        run: |
          F=tasmota/tasmota_xsns_sensor/xsns_62_esp32_mi_ble.ino
          sed -i '/AddLog.*No Key found/s|^|// |' "$F"
          echo "패치 확인:"
          grep -n "No Key found" "$F"

      # ── 2. /ble 웹페이지 race condition 수정 ─────────────────
      - name: Patch xdrv_79 - /ble handler before BLEInitState early-return
        run: |
          F=tasmota/tasmota_xdrv_driver/xdrv_79_esp32_ble.ino
          awk '
          /bool Xdrv79\(uint32_t function\)/ {inx=1}
          inx && /if \(!BLE_ESP32::BLEInitState\) \{/ && !done {
            print "#ifdef USE_WEBSERVER";
            print "  if (FUNC_WEB_ADD_BUTTON == function) { WSContentSend_P(BLE_ESP32::HTTP_BTN_MENU_BLE); return false; }";
            print "  if (FUNC_WEB_ADD_HANDLER == function) { WebServer_on(PSTR(\"/\" WEB_HANDLE_BLE), BLE_ESP32::HandleBleConfiguration); return false; }";
            print "#endif";
            done=1
          }
          {print}
          ' "$F" > "$F.new" && mv "$F.new" "$F"
          echo "패치 확인:"
          awk '/bool Xdrv79\(uint32_t function\)/,/switch \(function\) \{/' "$F"

      # ── 3. [핵심] Berry BLE/MI32 구조체 생성 (coc 실행) ──────
      - name: Generate Berry BLE/MI32 structures via coc
        run: |
          mkdir -p lib/libesp32/berry/generate
          cd lib/libesp32/berry
          python3 tools/coc/coc -o generate src default \
            ../berry_tasmota/src \
            ../berry_matter/src/solidify \
            ../berry_matter/src \
            ../berry_tasmota/src/solidify \
            ../berry_mapping/src \
            ../berry_int64/src \
            -c default/berry_conf.h
          echo "생성된 BLE/MI32 파일:"
          ls generate/ | grep -E "BLE|MI32"

      # ── 4. [핵심] Berry BLE 구현 추가 (USE_BLE_ESP32 케이스) ─────
      # 원래 조건 유지 + USE_BLE_ESP32 활성 시 별도 구현 블록 추가
      # (헤더 중복 포함 방지: extern 선언만 사용, xsns_62_esp32_mi.h 미포함)
      - name: Patch xdrv_52_3_berry_MI32.ino - add BLE impl for USE_BLE_ESP32 case
        run: |
          F=tasmota/tasmota_xdrv_driver/xdrv_52_3_berry_MI32.ino
          python3 << 'PYEOF'
          with open('tasmota/tasmota_xdrv_driver/xdrv_52_3_berry_MI32.ino', 'a') as f:
              f.write("""
#if defined(USE_MI_ESP32) && defined(USE_BLE_ESP32) && defined(USE_BERRY)
// BLE+MI32 Berry implementations when USE_BLE_ESP32 is active.
// Cannot include xsns_62_esp32_mi.h (already in xsns_62_esp32_mi_ble.ino).
// Use only extern declarations to avoid duplicate definitions.
extern "C" {
  // MI32 internal function declarations
  extern uint32_t MI32numberOfDevices();
  extern char * MI32getDeviceName(uint32_t slot);
  extern void MI32setBatteryForSlot(uint32_t slot, uint8_t value);
  extern void MI32setHumidityForSlot(uint32_t slot, float value);
  extern void MI32setTemperatureForSlot(uint32_t slot, float value);
  extern uint8_t * MI32getDeviceMAC(uint32_t slot);
  // BLE internal function declarations
  extern bool MI32checkBLEinitialization();
  extern void MI32BerryLoop();
  extern void MI32setBerryAdvCB(void* function, uint8_t *buffer);
  extern void MI32setBerryConnCB(void* function, uint8_t *buffer);
  extern void MI32setBerryServerCB(void* function, uint8_t *buffer);
  extern bool MI32runBerryConnection(uint8_t operation, bbool response, int32_t *arg1);
  extern bool MI32setBerryCtxSvc(const char *Svc, bbool discoverAttributes);
  extern bool MI32setBerryCtxChr(const char *Chr);
  extern bool MI32setBerryCtxMAC(uint8_t *MAC, uint8_t type);
  extern bool MI32addMACtoBlockList(uint8_t *MAC, uint8_t type);
  extern bool MI32addMACtoWatchList(uint8_t *MAC, uint8_t type);

  // be_MI32_* implementations
  static struct { const char * data = nullptr; size_t size = 0; void* callback = nullptr; } be_MI32Widget2;
  int be_MI32_devices(void) { return MI32numberOfDevices(); }
  void be_MI32_set_bat(int slot, int bat_val){ MI32setBatteryForSlot(slot,bat_val); }
  const char* be_MI32_get_name(int slot){ return MI32getDeviceName(slot); }
  uint8_t *be_MI32_get_MAC(int32_t slot, size_t *size){
    *size = 6; uint8_t *buf = MI32getDeviceMAC(slot); if(!buf)*size=0; return buf;
  }
  void be_MI32_set_hum(int slot, int hum_val){ MI32setHumidityForSlot(slot,hum_val); }
  void be_MI32_set_temp(int slot, int temp_val){ MI32setTemperatureForSlot(slot,temp_val); }
  bool be_MI32_widget(const char* sbuf, void* function){
    if(function) be_MI32Widget2.callback=function;
    if(be_MI32Widget2.size==0){be_MI32Widget2.data=sbuf;be_MI32Widget2.size=strlen(sbuf);return true;}
    return false;
  }

  // be_BLE_* implementations
  static bool be_BLE_check_MAC2(struct bvm *vm, size_t size){
    if(size!=6){be_raisef(vm,"ble_error","BLE: wrong size of MAC");return false;} return true;
  }
  int be_BLE_init(bvm *vm){
    if(MI32checkBLEinitialization()){be_return(vm);}
    be_raise(vm,"ble_error","BLE: device not initialized"); be_return_nil(vm);
  }
  void be_BLE_loop(void){ MI32BerryLoop(); }
  void be_BLE_reg_conn_cb(void* fn, uint8_t *buf){ MI32setBerryConnCB(fn,buf); }
  void be_BLE_reg_server_cb(void* fn, uint8_t *buf){ MI32setBerryServerCB(fn,buf); }
  void be_BLE_reg_adv_cb(void* fn, uint8_t *buf){
    if(!fn){MI32setBerryAdvCB(NULL,NULL);}else if(buf){MI32setBerryAdvCB(fn,buf);}
  }
  void be_BLE_set_MAC(struct bvm *vm, uint8_t *buf, size_t size, uint8_t type){
    if(!be_BLE_check_MAC2(vm,size))return;
    if(MI32setBerryCtxMAC(buf,type?type:0))return; be_raisef(vm,"ble_error","BLE: could not set MAC");
  }
  void be_BLE_set_service(struct bvm *vm, const char *Svc, bbool da){
    if(MI32setBerryCtxSvc(Svc,da?da:false))return; be_raisef(vm,"ble_error","BLE: could not set service");
  }
  void be_BLE_set_characteristic(struct bvm *vm, const char *Chr){
    if(MI32setBerryCtxChr(Chr))return; be_raisef(vm,"ble_error","BLE: could not set characteristic");
  }
  void be_BLE_run(struct bvm *vm, uint8_t op, bbool resp, int32_t arg1){
    int32_t a=arg1; int32_t *p=(be_top(vm)==3)?&a:nullptr;
    if(MI32runBerryConnection(op,resp?resp:false,p))return; be_raisef(vm,"ble_error","BLE: could not run operation");
  }
  void be_BLE_adv_block(struct bvm *vm, uint8_t *buf, size_t size, uint8_t type){
    if(!be_BLE_check_MAC2(vm,size))return;
    if(MI32addMACtoBlockList(buf,type?type:0))return; be_raisef(vm,"ble_error","BLE: could not block MAC");
  }
  void be_BLE_adv_watch(struct bvm *vm, uint8_t *buf, size_t size, uint8_t type){
    if(!be_BLE_check_MAC2(vm,size))return;
    if(MI32addMACtoWatchList(buf,type?type:0))return; be_raisef(vm,"ble_error","BLE: could not add MAC to watch list");
  }
  int32_t be_BLE_info(struct bvm *vm){
    be_newobject(vm,"map"); be_map_insert_str(vm,"role","observer"); be_pop(vm,1); be_return(vm);
  }
} // extern "C"
#endif // USE_MI_ESP32 && USE_BLE_ESP32 && USE_BERRY
""")
          PYEOF
          echo "패치 완료 - 마지막 10줄 확인:"
          tail -10 "$F"

      # ── 5. Zigbee ZNP → EZSP 전환 ────────────────────────────
      - name: Switch Zigbee ZNP -> EZSP
        run: |
          sed -i 's|^[[:space:]]*#define USE_ZIGBEE_ZNP|//&|' tasmota/my_user_config.h
          sed -i 's|^[[:space:]]*//[[:space:]]*#define USE_ZIGBEE_EZSP|#define USE_ZIGBEE_EZSP|' tasmota/my_user_config.h

      # ── 6. Zigbee + TCP_BRIDGE 주입 ───────────────────────────
      - name: Inject Zigbee + TCP_BRIDGE into FIRMWARE_BLUETOOTH
        run: |
          F=tasmota/include/tasmota_configurations_ESP32.h
          sed -i '/^#endif[[:space:]]*\/\/[[:space:]]*FIRMWARE_BLUETOOTH/i #define USE_ZIGBEE' "$F"
          sed -i '/^#endif[[:space:]]*\/\/[[:space:]]*FIRMWARE_BLUETOOTH/i #define USE_ZIGBEE_EZSP' "$F"
          sed -i '/^#endif[[:space:]]*\/\/[[:space:]]*FIRMWARE_BLUETOOTH/i #define USE_TCP_BRIDGE' "$F"

      # ── 7. user_config_override.h ─────────────────────────────
      - name: Write user_config_override.h
        run: |
          python3 -c "
          lines = [
            '#ifndef _USER_CONFIG_OVERRIDE_H_',
            '#define _USER_CONFIG_OVERRIDE_H_',
            '',
            '#define USE_ZIGBEE_EEPROM',
            '#define USE_ZIGBEE_CHANNEL 11',
            '',
            '#define USE_ETHERNET',
            '#define ETH_TYPE 0',
            '#define ETH_CLKMODE 3',
            '#undef  ETH_ADDRESS',
            '#define ETH_ADDRESS 1',
            '',
            '#define BLE_ESP32_ENABLE true',
            '',
            '#undef  CODE_IMAGE_STR',
            '#define CODE_IMAGE_STR \"tcp bridge and bluetooth\"',
            '',
            '#endif',
          ]
          open('tasmota/user_config_override.h', 'w').write('\n'.join(lines) + '\n')
          "

      # ── 8. [핵심] platformio_override.ini - USE_MI_ESP32 라이브러리에 전달
      - name: Write platformio_override.ini (add USE_MI_ESP32 to build flags)
        run: |
          python3 -c "
          lines = [
            '[env:tasmota32-bluetooth]',
            'extends                 = env:tasmota32_base',
            'build_flags             = \${env:tasmota32_base.build_flags}',
            '                          -DFIRMWARE_BLUETOOTH',
            '                          -DOTA_URL=\'\"http://ota.tasmota.com/tasmota32/release/tasmota32-bluetooth.bin\"\'',
            '                          -DUSE_MI_ESP32',
            'lib_extra_dirs          = lib/libesp32, lib/libesp32_div, lib/lib_basic, lib/lib_i2c, lib/lib_ssl',
            'lib_ignore              = \${env:tasmota32_base.lib_ignore}',
            '                          Micro-RTSP',
          ]
          open('platformio_override.ini', 'w').write('\n'.join(lines) + '\n')
          "
          echo "=== platformio_override.ini ==="
          cat platformio_override.ini

      # ── 9. 빌드 전 최종 검증 ─────────────────────────────────
      - name: Pre-build verification
        run: |
          echo "=== USE_BLE_ESP32 / USE_MI_ESP32 위치 ==="
          grep -n "USE_BLE_ESP32\|USE_MI_ESP32" tasmota/include/tasmota_configurations_ESP32.h | head -10
          echo ""
          echo "=== xdrv_52_3 패치 확인 ==="
          grep -n "if defined(USE_MI_ESP32)" tasmota/tasmota_xdrv_driver/xdrv_52_3_berry_MI32.ino
          echo ""
          echo "=== be_fixed_BLE.h 존재 확인 ==="
          ls lib/libesp32/berry/generate/be_fixed_BLE.h && echo "OK" || echo "MISSING"
          echo ""
          echo "=== No Key Found 패치 확인 ==="
          grep -c "// .*AddLog.*No Key" tasmota/tasmota_xsns_sensor/xsns_62_esp32_mi_ble.ino

      # ── 10. 빌드 ──────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build tasmota32-bluetooth
        run: platformio run -e tasmota32-bluetooth

      # ── 11. 결과 확인 ─────────────────────────────────────────
      - name: Check firmware size
        run: |
          BIN=build_output/firmware/tasmota32-bluetooth.bin
          SIZE=$(stat -c%s "$BIN")
          KB=$(( SIZE / 1024 ))
          echo "Binary: ${SIZE} bytes (${KB} KB)"
          if [ $KB -lt 1800 ] || [ $KB -gt 1900 ]; then
            echo "경고: 예상 범위(1800~1900KB) 벗어남"
          else
            echo "크기 정상"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tasmota32-zb-gw03-final
          path: |
            build_output/firmware/tasmota32-bluetooth.bin
            build_output/firmware/tasmota32-bluetooth.factory.bin
          retention-days: 14
