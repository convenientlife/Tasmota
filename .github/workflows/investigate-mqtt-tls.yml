name: Investigate Tasmota TLS library

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Q1 — BearSSL vs mbedTLS 사용 여부
        run: |
          echo "=== BearSSL 참조 ==="
          grep -rn "BearSSL\|bearssl\|t_xdrv_02_9_mqtt\|WiFiClientSecure_light" tasmota/tasmota_xdrv_driver/xdrv_02_9_mqtt.ino 2>/dev/null | head -20

      - name: Q2 — TLS buffer size 정의
        run: |
          echo "=== TLS_INSECURE / TLS_CA / MBEDTLS / SSL_BUFFER ==="
          grep -rn "MBEDTLS_SSL_IN_CONTENT_LEN\|MBEDTLS_SSL_OUT_CONTENT_LEN\|tls_in_content\|tls_out_content\|TLS_BUFFER" tasmota/ 2>/dev/null | head -20

      - name: Q3 — Tasmota TLS 에러 코드 -1002 매핑
        run: |
          echo "=== TLS connection error 출력 위치 ==="
          grep -rn "TLS connection error" tasmota/ 2>/dev/null | head -10

      - name: Q4 — Mosquitto 호환 cipher 정의
        run: |
          echo "=== 지원하는 cipher 명시 ==="
          grep -rn "TLS_CIPHER\|cipher_suite\|SUPPORTED_CIPHER" tasmota/ 2>/dev/null | head -20
          echo ""
          echo "=== bear_ssl 헤더 ==="
          find lib/ -name "bear*.h" -o -name "BearSSL*.h" 2>/dev/null | head -10
