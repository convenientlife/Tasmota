name: Investigate Tasmota BLE environments

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable Tasmota v14.6.0
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Find FIRMWARE_BLUETOOTH defines
        run: |
          echo "====== FIRMWARE_BLUETOOTH 정의 위치 ======"
          grep -rn "FIRMWARE_BLUETOOTH" tasmota/ | head -30

          echo "====== FIRMWARE_ZBBRDGPRO 정의 위치 ======"
          grep -rn "FIRMWARE_ZBBRDGPRO" tasmota/ | head -30

          echo "====== BLE 관련 설정 파일 ======"
          find tasmota/ -name "*.h" | xargs grep -l "USE_BLE_ESP32" 2>/dev/null

          echo "====== USE_BLE_ESP32 관련 define 블록 ======"
          grep -rn "USE_BLE_ESP32" tasmota/ | grep -v ".ino" | head -30
