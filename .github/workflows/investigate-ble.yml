name: Investigate ble-page guard and SetOption115

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable Tasmota v14.6.0
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Q1 - real /ble handler source + guard
        run: |
          echo "=== D_BLE_DEVICES / D_BLE_ENABLE 사용 .ino 파일 ==="
          grep -rln "D_BLE_DEVICES\|D_BLE_ENABLE" tasmota/*.ino 2>/dev/null || echo "(없음)"
          for f in $(grep -rln "D_BLE_DEVICES\|D_BLE_ENABLE" tasmota/*.ino 2>/dev/null); do
            echo "######## $f ########"
            grep -n "USE_MI_EXT_GUI\|USE_MI_ESP32\|USE_BLE_ESP32\|#ifdef\|#ifndef\|#else\|#endif\|\"ble\"\|/ble\|D_BLE_DEVICES\|D_BLE_ENABLE\|WebServer\|On(\"" "$f" | head -40
          done

      - name: Q2 - USE_MI_EXT_GUI all references
        run: |
          grep -rn "USE_MI_EXT_GUI" tasmota/ 2>/dev/null | head -30 || echo "(USE_MI_EXT_GUI 참조 없음)"

      - name: Q3 - SetOption115 define and flag mapping
        run: |
          echo "=== my_user_config.h 의 [SetOption115] 라인 ==="
          grep -n "SetOption115\|\[SetOption11[0-9]\]" tasmota/my_user_config.h 2>/dev/null || echo "(my_user_config.h 에 SetOption115 명시 default 없음)"
          echo "=== flag5 구조체 멤버 (115 비트) ==="
          grep -n "flag5" tasmota/include/tasmota_types.h 2>/dev/null | head -30 || echo "(없음)"
          echo "=== P115 / SetOption115 코드 처리 ==="
          grep -rn "115" tasmota/xsns_62*.ino 2>/dev/null | grep -iE "option|flag5|enable|MasterEnable|115" | head -20 || echo "(없음)"
          echo "=== xsns_62 파일명 확인 ==="
          ls tasmota/ | grep -iE "xsns_62|mi" || true
