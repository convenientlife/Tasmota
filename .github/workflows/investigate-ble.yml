name: Investigate Tasmota BLE environments

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable Tasmota v14.6.0
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Find all environments and BLE references
        run: |
          echo "====== platformio.ini 내 모든 환경명 ======"
          grep "^\[env:" platformio.ini

          echo "====== BLE 관련 환경명 ======"
          grep -i "bluetooth\|ble" platformio.ini | head -30 || true

          echo "====== NimBLE 위치 ======"
          find lib/ -name "NimBLEDevice.h" 2>/dev/null || true
          find lib/ -name "*nimble*" -o -name "*NimBLE*" 2>/dev/null | head -20 || true

          echo "====== tasmota32-zbbrdgpro 환경 ======"
          grep -A 40 "\[env:tasmota32-zbbrdgpro\]" platformio.ini || true
