name: Investigate Tasmota BLE environments

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable Tasmota v14.6.0
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Get tasmota32-bluetooth environment detail
        run: |
          echo "====== tasmota32-bluetooth 환경 (line 220~270) ======"
          sed -n '220,270p' platformio_tasmota_env32.ini

          echo "====== tasmota32-zbbrdgpro 환경 ======"
          grep -n "tasmota32-zbbrdgpro" platformio_tasmota_env32.ini
          grep -A 30 "\[env:tasmota32-zbbrdgpro\]" platformio_tasmota_env32.ini

          echo "====== core32 섹션 ======"
          grep -A 20 "^\[core32\]" platformio_tasmota_env32.ini || true
          grep -A 20 "^\[core32\]" platformio.ini || true
