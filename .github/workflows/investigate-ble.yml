name: Locate /ble handler guard in xdrv_79

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: xdrv_79 /ble registration guard context
        run: |
          F=tasmota/tasmota_xdrv_driver/xdrv_79_esp32_ble.ino
          echo "=== 3560~3760 (HTTP_FORM_BLE ~ WebServer_on 등록부) ==="
          sed -n '3560,3760p' "$F"

      - name: FUNC_WEB_ADD_HANDLER / ifdef context around 3743
        run: |
          F=tasmota/tasmota_xdrv_driver/xdrv_79_esp32_ble.ino
          echo "=== 3700~3760 라인 + #ifdef/#if/case 컨텍스트 ==="
          awk 'NR>=3000 && NR<=3760 && (/#ifdef|#ifndef|#if |#else|#endif|FUNC_WEB|case |WebServer_on|HandleBleConfiguration|WEB_HANDLE_BLE/) {print NR": "$0}' "$F"

      - name: USE_ guards wrapping the web config block
        run: |
          F=tasmota/tasmota_xdrv_driver/xdrv_79_esp32_ble.ino
          echo "=== 파일 내 USE_MI_EXT_GUI / USE_BLE_ESP32 전처리 분기 ==="
          grep -n "USE_MI_EXT_GUI\|USE_BLE_ESP32\|#ifdef\|#ifndef\|#endif\|#else" "$F" | sed -n '1,60p'
