name: Investigate Tasmota BLE complete

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable Tasmota v14.6.0
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: 1. Include order of config headers
        run: |
          echo "=== tasmota_configurations.h 가 ESP32.h 를 include 하는가? ==="
          grep -n "tasmota_configurations_ESP32\|tasmota_configurations.h" tasmota/include/tasmota_configurations.h
          echo ""
          echo "=== 두 헤더가 어디서 include 되는가 (포함 순서) ==="
          grep -rn "tasmota_configurations.h\|tasmota_configurations_ESP32.h" tasmota/*.ino tasmota/include/tasmota_post.h tasmota/include/tasmota.h 2>/dev/null | head -20

      - name: 2. ALL USE_EQ3_ESP32 locations
        run: |
          echo "=== ESP32.h 의 USE_EQ3_ESP32 ==="
          grep -n "USE_EQ3_ESP32" tasmota/include/tasmota_configurations_ESP32.h
          echo "=== configurations.h 의 USE_EQ3_ESP32 ==="
          grep -n "USE_EQ3_ESP32" tasmota/include/tasmota_configurations.h

      - name: 3. USE_MI_EXT_GUI any definition
        run: |
          grep -rn "define USE_MI_EXT_GUI\|undef USE_MI_EXT_GUI" tasmota/ | head -20 || echo "USE_MI_EXT_GUI 정의 없음 (기본값 미정의 - 정상)"

      - name: 4. configurations.h 920~945 (940 undef 블록의 #ifdef 컨텍스트)
        run: |
          echo "=== 이 undef 블록이 어떤 firmware 조건 안에 있는지 확인 ==="
          sed -n '850,945p' tasmota/include/tasmota_configurations.h | grep -n "#ifdef\|#ifndef\|#endif\|#elif\|FIRMWARE_\|undef USE_BLE_ESP32\|undef USE_MI_ESP32\|undef USE_ZIGBEE\|undef USE_TCP_BRIDGE"

      - name: 5. ESP32.h 125~140 and 238~248 (주입 지점 이전 undef 블록 컨텍스트)
        run: |
          echo "=== line 125~140 ==="
          sed -n '125,140p' tasmota/include/tasmota_configurations_ESP32.h
          echo "=== line 238~248 ==="
          sed -n '238,248p' tasmota/include/tasmota_configurations_ESP32.h

      - name: 6. NimBLE library presence in grafted lib dirs
        run: |
          echo "=== NimBLEDevice.h 실제 위치 ==="
          find lib/ -name "NimBLEDevice.h" 2>/dev/null
          echo "=== libesp32 / libesp32_div 하위 BLE 관련 ==="
          ls lib/libesp32/ 2>/dev/null | grep -i "ble\|nimble\|mi32\|eq3" || true
          ls lib/libesp32_div/ 2>/dev/null | grep -i "ble\|nimble\|mi32\|eq3" || true
