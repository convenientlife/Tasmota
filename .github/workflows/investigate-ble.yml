name: Investigate Tasmota BLE environments

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable Tasmota v14.6.0
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Explore directory structure
        run: |
          echo "====== 루트 디렉토리 ======"
          ls -la

          echo "====== .ini 파일 목록 ======"
          find . -maxdepth 2 -name "*.ini" | sort

          echo "====== platformio 관련 파일 내용 ======"
          for f in $(find . -maxdepth 2 -name "*.ini" | sort); do
            echo "--- $f ---"
            head -20 "$f"
            echo ""
          done

          echo "====== lib/ 디렉토리 ======"
          ls lib/ || true

          echo "====== BLE/NimBLE 검색 ======"
          grep -rn "bluetooth\|NimBLE\|nimble" . --include="*.ini" || true
