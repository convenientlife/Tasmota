name: Investigate Tasmota BLE environments

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable Tasmota v14.6.0
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Get ZBBRDGPRO section and undef context
        run: |
          echo "====== ZBBRDGPRO 섹션 (491~540) ======"
          sed -n '491,540p' tasmota/include/tasmota_configurations_ESP32.h

          echo "====== configurations.h 930~950 (undef line 940 주변) ======"
          sed -n '930,950p' tasmota/include/tasmota_configurations.h

          echo "====== user_config_override.h include 위치 ======"
          grep -n "user_config_override\|USER_CONFIG_OVERRIDE" tasmota/my_user_config.h | tail -5
          grep -rn "user_config_override\|USER_CONFIG_OVERRIDE" tasmota/tasmota.h 2>/dev/null || true
          grep -rn "user_config_override\|USER_CONFIG_OVERRIDE" tasmota/include/ | head -10
