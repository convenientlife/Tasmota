name: Investigate Tasmota BLE environments

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable Tasmota v14.6.0
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Compare bluetooth vs zbbrdgpro environments
        run: |
          echo "====== tasmota32-bluetooth ======"
          grep -A 40 "\[env:tasmota32-bluetooth\]" platformio.ini

          echo "====== tasmota32-zbbrdgpro ======"
          grep -A 40 "\[env:tasmota32-zbbrdgpro\]" platformio.ini

          echo "====== 베이스 공통 환경 ======"
          grep -E "^\[common|^\[core|^\[env:tasmota32\b" platformio.ini | head -20

          echo "====== lib/ 디렉토리 목록 ======"
          ls -la lib/

          echo "====== NimBLE 위치 ======"
          find lib/ -name "NimBLEDevice.h" 2>/dev/null
          find lib/ -name "*nimble*" -o -name "*NimBLE*" 2>/dev/null | head -20
