name: Investigate Tasmota BLE environments

on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable Tasmota v14.6.0
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Get FIRMWARE_BLUETOOTH full section
        run: |
          echo "====== FIRMWARE_BLUETOOTH 섹션 전체 (251~280) ======"
          sed -n '251,280p' tasmota/include/tasmota_configurations_ESP32.h

          echo "====== USE_MI_ESP32 undef 위치 ======"
          grep -n "USE_MI_ESP32" tasmota/include/tasmota_configurations_ESP32.h
          grep -n "USE_MI_ESP32" tasmota/include/tasmota_configurations.h | head -20
