name: Locate "No Key found" in Tasmota source

on:
  workflow_dispatch:

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Find "No Key found" everywhere
        run: |
          echo "=== 'No Key found' 모든 발생 위치 ==="
          grep -rn "No Key found" tasmota/ 2>/dev/null || echo "(매칭 없음)"

          echo ""
          echo "=== 파일별 출현 횟수 ==="
          grep -rl "No Key found" tasmota/ 2>/dev/null | while read f; do
            COUNT=$(grep -c "No Key found" "$f")
            echo "$COUNT 회: $f"
          done

          echo ""
          echo "=== 발생 라인의 전후 context (각 매칭 ±2줄) ==="
          grep -rn -B 2 -A 2 "No Key found" tasmota/ 2>/dev/null || true
