name: Verify defines in Tasmota v14.6.0

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Check USE_BLE_DISPLAY / USE_BLE_NATIVE existence
        run: |
          echo "=== USE_BLE_DISPLAY ==="
          grep -rn "USE_BLE_DISPLAY" tasmota/ 2>/dev/null || echo "→ Tasmota 소스에 없음. cargo-cult code 확정."

          echo ""
          echo "=== USE_BLE_NATIVE ==="
          grep -rn "USE_BLE_NATIVE" tasmota/ 2>/dev/null || echo "→ Tasmota 소스에 없음. cargo-cult code 확정."

          echo ""
          echo "=== 비교: 검증된 defines (참조용) ==="
          for D in USE_BLE_ESP32 USE_MI_ESP32 USE_MI_EXT_GUI USE_EQ3_ESP32 BLE_ESP32_ENABLE WEB_HANDLE_BLE; do
            COUNT=$(grep -rn "$D" tasmota/ 2>/dev/null | wc -l)
            echo "$D: $COUNT 곳에서 참조됨"
          done
