name: Build ZB-GW03 Tasmota with TCP Bridge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build tasmota32-zigbeebridge
        run: platformio run -e tasmota32-zigbeebridge

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota32-zigbeebridge-tcpbridge
          path: |
            build_output/firmware/tasmota32-zigbeebridge.bin
            build_output/firmware/tasmota32-zigbeebridge.factory.bin
          retention-days: 7
