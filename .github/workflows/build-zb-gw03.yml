name: Build ZB-GW03 Tasmota with TCP Bridge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build tasmota32-zb-gw03
        run: platformio run -e tasmota32-zb-gw03

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota32-zb-gw03
          path: |
            build_output/firmware/tasmota32-zb-gw03.bin
            build_output/firmware/tasmota32-zb-gw03.factory.bin
          retention-days: 7
