name: Build ZB-GW03 bluetooth+zigbee (footer) + investigate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout stable Tasmota v14.6.0
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: INVESTIGATE - /ble define, MI_EXT_GUI, SetOption115
        run: |
          echo "########## Q1: /ble 웹페이지 가드 define ##########"
          for f in $(grep -rln "Devices Seen\|action='ble'" tasmota/ 2>/dev/null); do
            echo "--- $f : USE_ 가드 컨텍스트 ---"
            grep -n "USE_MI_EXT_GUI\|USE_MI_ESP32\|#ifdef\|#ifndef\|#endif\|action='ble'\|Devices Seen\|WebServer\|Webserver\|RegisterWeb" "$f" | head -30
          done
          echo ""
          echo "########## Q2: USE_MI_EXT_GUI 전체 참조 ##########"
          grep -rn "USE_MI_EXT_GUI" tasmota/ 2>/dev/null | head -25 || echo "(없음)"
          echo ""
          echo "########## Q3: SetOption115 매핑 + 기본값 ##########"
          echo "--- P115 / SetOption115 처리 ---"
          grep -rn "P115\|115" tasmota/xsns_62*.ino tasmota/xdrv_*.ino 2>/dev/null | grep -iE "setoption|mi32|ble|flag5|MasterEnable" | head -20 || echo "(없음)"
          echo "--- flag5 / mi32 설정 멤버 ---"
          grep -rn "flag5\|mi32" tasmota/include/tasmota_types.h 2>/dev/null | head -20 || echo "(없음)"
          echo "--- Enable Bluetooth 체크박스가 set 하는 멤버 ---"
          for f in $(grep -rln "Enable Bluetooth" tasmota/ 2>/dev/null); do
            echo "--- $f ---"
            grep -n "Enable Bluetooth\|flag5\|SetOption115\|MasterEnable\|->enable\|mi32" "$f" | head -20
          done
          echo "--- my_user_config.h SetOption 기본값 override 패턴 ---"
          grep -n "SetOption\|flag5\|MI32\|MasterEnable" tasmota/my_user_config.h 2>/dev/null | head -15 || echo "(없음)"

      - name: Switch Zigbee protocol ZNP -> EZSP in source
        run: |
          sed -i 's|^[[:space:]]*#define USE_ZIGBEE_ZNP|//&|' tasmota/my_user_config.h
          sed -i 's|^[[:space:]]*//[[:space:]]*#define USE_ZIGBEE_EZSP|#define USE_ZIGBEE_EZSP|' tasmota/my_user_config.h
          grep -n "USE_ZIGBEE_ZNP\|USE_ZIGBEE_EZSP" tasmota/my_user_config.h | head -5

      - name: Inject Zigbee into FIRMWARE_BLUETOOTH section
        run: |
          sed -i '/^#endif[[:space:]]*\/\/[[:space:]]*FIRMWARE_BLUETOOTH/i #define USE_ZIGBEE' tasmota/include/tasmota_configurations_ESP32.h
          sed -i '/^#endif[[:space:]]*\/\/[[:space:]]*FIRMWARE_BLUETOOTH/i #define USE_ZIGBEE_EZSP' tasmota/include/tasmota_configurations_ESP32.h
          sed -i '/^#endif[[:space:]]*\/\/[[:space:]]*FIRMWARE_BLUETOOTH/i #define USE_TCP_BRIDGE' tasmota/include/tasmota_configurations_ESP32.h
          echo "=== FIRMWARE_BLUETOOTH 섹션 끝 ==="
          sed -n '270,290p' tasmota/include/tasmota_configurations_ESP32.h

      - name: Inject ZB-GW03 config (Ethernet + Zigbee + footer)
        run: |
          cat > tasmota/user_config_override.h << 'EOF'
          #ifndef _USER_CONFIG_OVERRIDE_H_
          #define _USER_CONFIG_OVERRIDE_H_
          #define USE_ZIGBEE_EEPROM
          #define USE_ZIGBEE_CHANNEL 11
          #define USE_ETHERNET
          #define ETH_TYPE 0
          #define ETH_CLKMODE 3
          #undef  ETH_ADDRESS
          #define ETH_ADDRESS 1
          #undef  CODE_IMAGE_STR
          #define CODE_IMAGE_STR "tcp bridge and bluetooth"
          #endif
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build tasmota32-bluetooth
        run: platformio run -e tasmota32-bluetooth

      - name: Check firmware size
        run: |
          SIZE=$(stat -c%s build_output/firmware/tasmota32-bluetooth.bin)
          echo "Binary size: $SIZE bytes ($(( SIZE / 1024 )) KB)  / 동료 1846 KB"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota32-zb-gw03-bt-zigbee-footer
          path: |
            build_output/firmware/tasmota32-bluetooth.bin
            build_output/firmware/tasmota32-bluetooth.factory.bin
          retention-days: 7
