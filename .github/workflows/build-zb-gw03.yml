name: Build FINAL - v1 + /ble race fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Patch xdrv_79 - register /ble handler before BLEInitState early-return
        run: |
          F=tasmota/tasmota_xdrv_driver/xdrv_79_esp32_ble.ino
          awk '
          /bool Xdrv79\(uint32_t function\)/ {inx=1}
          inx && /if \(!BLE_ESP32::BLEInitState\) \{/ && !done {
            print "#ifdef USE_WEBSERVER";
            print "  if (FUNC_WEB_ADD_BUTTON == function) { WSContentSend_P(BLE_ESP32::HTTP_BTN_MENU_BLE); return false; }";
            print "  if (FUNC_WEB_ADD_HANDLER == function) { WebServer_on(PSTR(\"/\" WEB_HANDLE_BLE), BLE_ESP32::HandleBleConfiguration); return false; }";
            print "#endif";
            done=1
          }
          {print}
          ' "$F" > "$F.new" && mv "$F.new" "$F"
          echo "=== 패치 검증 (Xdrv79 함수 시작~switch) ==="
          awk '/bool Xdrv79\(uint32_t function\)/,/switch \(function\) \{/' "$F"

      - name: Switch Zigbee protocol ZNP -> EZSP
        run: |
          sed -i 's|^[[:space:]]*#define USE_ZIGBEE_ZNP|//&|' tasmota/my_user_config.h
          sed -i 's|^[[:space:]]*//[[:space:]]*#define USE_ZIGBEE_EZSP|#define USE_ZIGBEE_EZSP|' tasmota/my_user_config.h

      - name: Inject Zigbee into FIRMWARE_BLUETOOTH section
        run: |
          sed -i '/^#endif[[:space:]]*\/\/[[:space:]]*FIRMWARE_BLUETOOTH/i #define USE_ZIGBEE' tasmota/include/tasmota_configurations_ESP32.h
          sed -i '/^#endif[[:space:]]*\/\/[[:space:]]*FIRMWARE_BLUETOOTH/i #define USE_ZIGBEE_EZSP' tasmota/include/tasmota_configurations_ESP32.h
          sed -i '/^#endif[[:space:]]*\/\/[[:space:]]*FIRMWARE_BLUETOOTH/i #define USE_TCP_BRIDGE' tasmota/include/tasmota_configurations_ESP32.h

      - name: Inject ZB-GW03 config (Ethernet + SetOption115 + footer)
        run: |
          cat > tasmota/user_config_override.h << 'EOF'
          #ifndef _USER_CONFIG_OVERRIDE_H_
          #define _USER_CONFIG_OVERRIDE_H_
          #define USE_ZIGBEE_EEPROM
          #define USE_ZIGBEE_CHANNEL 11
          #define USE_ETHERNET
          #define ETH_TYPE 0
          #define ETH_CLKMODE 3
          #undef  ETH_ADDRESS
          #define ETH_ADDRESS 1
          #define BLE_ESP32_ENABLE true
          #undef  CODE_IMAGE_STR
          #define CODE_IMAGE_STR "tcp bridge and bluetooth"
          #endif
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build tasmota32-bluetooth
        run: platformio run -e tasmota32-bluetooth
      - name: Check firmware size
        run: |
          SIZE=$(stat -c%s build_output/firmware/tasmota32-bluetooth.bin)
          echo "Binary size: $SIZE bytes ($(( SIZE / 1024 )) KB) / v1=1847"
      - uses: actions/upload-artifact@v4
        with:
          name: tasmota32-zb-gw03-final-blefix
          path: |
            build_output/firmware/tasmota32-bluetooth.bin
            build_output/firmware/tasmota32-bluetooth.factory.bin
          retention-days: 7
