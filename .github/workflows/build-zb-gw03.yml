name: Build ZB-GW03 Tasmota with TCP Bridge & BLE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout stable Tasmota v14.6.0
        uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: Switch Zigbee protocol ZNP -> EZSP in source
        run: |
          sed -i 's|^[[:space:]]*#define USE_ZIGBEE_ZNP|//&|' tasmota/my_user_config.h
          sed -i 's|^[[:space:]]*//[[:space:]]*#define USE_ZIGBEE_EZSP|#define USE_ZIGBEE_EZSP|' tasmota/my_user_config.h
          echo "=== Zigbee protocol lines ==="
          grep -n "USE_ZIGBEE_ZNP\|USE_ZIGBEE_EZSP" tasmota/my_user_config.h | head -10

      - name: Inject full BLE stack into ZBBRDGPRO section
        run: |
          sed -i '/^#endif \/\/ FIRMWARE_ZBBRDGPRO/i #define USE_BLE_ESP32                            // BLE NimBLE core driver' tasmota/include/tasmota_configurations_ESP32.h
          sed -i '/^#endif \/\/ FIRMWARE_ZBBRDGPRO/i #define USE_EQ3_ESP32                            // BLE bundle component (matches FIRMWARE_BLUETOOTH)' tasmota/include/tasmota_configurations_ESP32.h
          sed -i '/^#endif \/\/ FIRMWARE_ZBBRDGPRO/i #define USE_MI_ESP32                             // BLE scan loop + /ble UI + telemetry' tasmota/include/tasmota_configurations_ESP32.h
          echo "=== 주입 결과 (FIRMWARE_ZBBRDGPRO 섹션 끝부분) ==="
          grep -n "USE_BLE_ESP32\|USE_EQ3_ESP32\|USE_MI_ESP32\|FIRMWARE_ZBBRDGPRO" tasmota/include/tasmota_configurations_ESP32.h | sed -n '/491/,/540/p'
          echo "--- 530~540 라인 직접 확인 ---"
          sed -n '530,545p' tasmota/include/tasmota_configurations_ESP32.h

      - name: Inject ZB-GW03 config (Ethernet)
        run: |
          cat > tasmota/user_config_override.h << 'EOF'
          #ifndef _USER_CONFIG_OVERRIDE_H_
          #define _USER_CONFIG_OVERRIDE_H_
          #define USE_ZIGBEE_EEPROM
          #define USE_ZIGBEE_CHANNEL 11
          #define USE_ETHERNET
          #define ETH_TYPE 0
          #define ETH_CLKMODE 3
          #undef  ETH_ADDRESS
          #define ETH_ADDRESS 1
          #endif
          EOF

      - name: Graft BLE lib paths from tasmota32-bluetooth
        run: |
          cat > platformio_override.ini << 'EOF'
          [env:tasmota32-zbbrdgpro]
          lib_extra_dirs = lib/lib_basic, lib/lib_ssl, lib/libesp32, lib/libesp32_div, lib/lib_i2c
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build tasmota32-zbbrdgpro
        run: platformio run -e tasmota32-zbbrdgpro

      - name: Check firmware size
        run: |
          SIZE=$(stat -c%s build_output/firmware/tasmota32-zbbrdgpro.bin)
          KB=$(( SIZE / 1024 ))
          echo "Binary size: $SIZE bytes ($KB KB)"
          echo "ZBBRDGPRO app partition limit: 1856 KB"
          if [ $SIZE -gt 1900480 ]; then
            echo "FAIL: 1856KB 파티션 초과 - OTA 불가. USE_EQ3_ESP32 제거 또는 파티션 변경 필요"
            exit 1
          else
            echo "OK: OTA 가능 (여유 $(( 1900480 - SIZE )) bytes)"
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota32-zb-gw03-ble
          path: |
            build_output/firmware/tasmota32-zbbrdgpro.bin
            build_output/firmware/tasmota32-zbbrdgpro.factory.bin
          retention-days: 7
