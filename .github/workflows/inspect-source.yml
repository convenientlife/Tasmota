name: Inspect Source - BLE Berry Root Cause

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: "[1] berry library.json 및 generate 폴더 확인"
        run: |
          echo "=== lib/libesp32/berry/ 폴더 구조 ==="
          ls lib/libesp32/berry/
          echo ""
          echo "=== library.json 내용 ==="
          cat lib/libesp32/berry/library.json 2>/dev/null || echo "없음"
          echo ""
          echo "=== generate 폴더 존재 여부 ==="
          ls lib/libesp32/berry/generate/ 2>/dev/null || echo "generate 폴더 없음"

      - name: "[2] generate 폴더 생성 후 coc 재실행"
        run: |
          mkdir -p lib/libesp32/berry/generate
          cd lib/libesp32/berry
          echo "=== coc 실행 ==="
          python3 tools/coc/coc -o generate src default \
            ../berry_tasmota/src \
            ../berry_matter/src/solidify \
            ../berry_matter/src \
            ../berry_tasmota/src/solidify \
            ../berry_mapping/src \
            ../berry_int64/src \
            -c default/berry_conf.h 2>&1
          echo ""
          echo "=== generate 폴더 생성된 파일 ==="
          ls generate/ | grep -i "BLE\|MI32" || echo "BLE/MI32 없음"
          ls generate/ | head -20
          echo ""
          echo "=== be_fixed_MI32.h 앞 20줄 ==="
          head -20 generate/be_fixed_MI32.h 2>/dev/null || echo "없음"
          echo ""
          echo "=== be_fixed_BLE.h 앞 20줄 ==="
          head -20 generate/be_fixed_BLE.h 2>/dev/null || echo "없음"

      - name: "[3] berry_tasmota library.json - include 경로 확인"
        run: |
          echo "=== lib/libesp32/berry_tasmota/ 폴더 구조 ==="
          ls lib/libesp32/berry_tasmota/
          echo ""
          echo "=== library.json 내용 ==="
          cat lib/libesp32/berry_tasmota/library.json 2>/dev/null || echo "없음"
