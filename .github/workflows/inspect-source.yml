name: Inspect Source - BLE Berry Root Cause

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: "[1] gen-berry-structures.py 전체 내용"
        run: |
          cat pio-tools/gen-berry-structures.py

      - name: "[2] coc 도구 파일 목록 및 진입점"
        run: |
          echo "=== lib/libesp32/berry/tools/coc/ 목록 ==="
          ls -la lib/libesp32/berry/tools/coc/
          echo ""
          echo "=== coc 또는 __main__.py 내용 (첫 30줄) ==="
          cat lib/libesp32/berry/tools/coc/coc 2>/dev/null | head -30 || echo "coc 없음"
          ls lib/libesp32/berry/tools/coc/*.py | head -5 | while read f; do
            echo "--- $f 첫 5줄 ---"
            head -5 "$f"
          done

      - name: "[3] coc 직접 실행 테스트 (be_fixed_MI32.h 생성)"
        run: |
          cd lib/libesp32/berry
          echo "=== coc 실행 (generate 모드) ==="
          python3 tools/coc/coc -o generate src default \
            ../berry_tasmota/src \
            ../berry_matter/src/solidify \
            ../berry_matter/src \
            ../berry_tasmota/src/solidify \
            ../berry_mapping/src \
            ../berry_int64/src \
            -c default/berry_conf.h 2>&1 | tail -20
          echo ""
          echo "=== 생성된 be_fixed_*.h 파일 ==="
          find ../berry_tasmota/src -name "be_fixed_*.h" 2>/dev/null | sort
          echo ""
          echo "=== be_fixed_MI32.h 앞 20줄 ==="
          head -20 ../berry_tasmota/src/be_fixed_MI32.h 2>/dev/null || echo "생성 안 됨"
          echo ""
          echo "=== be_fixed_BLE.h 앞 20줄 ==="
          head -20 ../berry_tasmota/src/be_fixed_BLE.h 2>/dev/null || echo "생성 안 됨"
