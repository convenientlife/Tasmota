name: Inspect Source - BLE Berry Root Cause

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: "[1] berry_tasmota/src 폴더 전체 파일 목록"
        run: |
          echo "=== lib/libesp32/berry_tasmota/src/ 전체 ==="
          ls -la lib/libesp32/berry_tasmota/src/ | sort
          echo ""
          echo "=== be_modtab 이름 포함 파일 탐색 ==="
          find . -name "*modtab*" | grep -v ".git" | sort

      - name: "[2] be_MI32_lib.c 전체 내용"
        run: |
          cat lib/libesp32/berry_tasmota/src/be_MI32_lib.c

      - name: "[3] xdrv_52_3_berry_MI32.ino 전체 내용"
        run: |
          cat tasmota/tasmota_xdrv_driver/xdrv_52_3_berry_MI32.ino

      - name: "[4] platformio_tasmota_env32.ini - tasmota32-bluetooth 환경"
        run: |
          echo "=== [env:tasmota32-bluetooth] 섹션 ==="
          awk '/^\[env:tasmota32-bluetooth\]/,/^\[/' platformio_tasmota_env32.ini | head -40

      - name: "[5] BLE Berry 관련 xdrv_79 파일에서 Berry 등록 코드"
        run: |
          F=tasmota/tasmota_xdrv_driver/xdrv_79_esp32_ble.ino
          echo "=== Berry 모듈 등록 관련 코드 ==="
          grep -n "berry\|Berry\|be_module\|be_define\|add_driver\|MI32\|BLE" "$F" | head -40
          echo ""
          echo "=== xdrv_52 파일 목록 ==="
          ls tasmota/tasmota_xdrv_driver/xdrv_52* 2>/dev/null
