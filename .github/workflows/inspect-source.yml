name: Inspect Source - BLE Berry Root Cause

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: "[1] tasmota_options.h 내용 (berry_tasmota 라이브러리가 force-include 하는 파일)"
        run: |
          echo "=== include/ 폴더 파일 목록 ==="
          ls include/ 2>/dev/null || echo "없음"
          echo ""
          echo "=== tasmota/include/ 폴더에서 tasmota_options.h 탐색 ==="
          find . -name "tasmota_options.h" | grep -v ".git" || echo "없음"
          echo ""
          echo "=== tasmota/tasmota_options.h 내용 (있으면) ==="
          cat tasmota/tasmota_options.h 2>/dev/null | head -30 || echo "없음"

      - name: "[2] coc 실행 후 be_MI32_lib.c 컴파일 테스트"
        run: |
          # coc 실행 (generate 폴더 생성)
          mkdir -p lib/libesp32/berry/generate
          cd lib/libesp32/berry
          python3 tools/coc/coc -o generate src default \
            ../berry_tasmota/src \
            ../berry_matter/src/solidify \
            ../berry_matter/src \
            ../berry_tasmota/src/solidify \
            ../berry_mapping/src \
            ../berry_int64/src \
            -c default/berry_conf.h
          cd /home/runner/work/Tasmota/Tasmota
          echo "생성 확인: $(ls lib/libesp32/berry/generate/ | grep -E 'BLE|MI32')"

          # USE_MI_ESP32 정의 시 be_MI32_lib.c 컴파일 테스트
          echo ""
          echo "=== USE_MI_ESP32 정의 시 컴파일 테스트 ==="
          gcc -DUSE_MI_ESP32 \
              -I lib/libesp32/berry/generate \
              -I lib/libesp32/berry/src \
              -I lib/libesp32/berry_mapping/src \
              -fsyntax-only \
              lib/libesp32/berry_tasmota/src/be_MI32_lib.c 2>&1 \
            && echo "컴파일 성공 (USE_MI_ESP32 정의 시 be_fixed_BLE.h 포함됨)" \
            || echo "컴파일 실패 - 추가 include 경로 필요"
