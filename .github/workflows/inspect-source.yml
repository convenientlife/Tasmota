name: Inspect Source - BLE Berry Root Cause

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: "[1] lib/libesp32/berry/default/be_modtab.c 전체 내용"
        run: |
          cat lib/libesp32/berry/default/be_modtab.c

      - name: "[2] lib/libesp32/berry/default/ 폴더 전체 파일 목록"
        run: |
          ls -la lib/libesp32/berry/default/
          echo ""
          echo "=== berry.h 내 모듈 등록 관련 ==="
          grep -n "be_module\|native_module\|be_load\|modtab" lib/libesp32/berry/src/be_module.c 2>/dev/null | head -30

      - name: "[3] be_port.cpp 전체 내용 (모듈 등록 부분 탐색)"
        run: |
          echo "=== static_block 사용 위치 ==="
          grep -n "static_block\|be_reg\|loadsolid\|builtin" lib/libesp32/berry_tasmota/src/be_port.cpp | head -20
          echo ""
          echo "=== be_port.cpp 중반부 (200~300줄) ==="
          sed -n '200,300p' lib/libesp32/berry_tasmota/src/be_port.cpp
