name: Inspect Source - BLE Berry Root Cause

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: "[1] pio-tools 폴더 전체 파일 목록"
        run: |
          echo "=== pio-tools/ 파일 목록 ==="
          ls -la pio-tools/
          echo ""
          echo "=== pre_source_dir.py 전체 내용 ==="
          cat pio-tools/pre_source_dir.py
          echo ""

      - name: "[2] add_c_flags.py 전체 내용"
        run: |
          cat pio-tools/add_c_flags.py 2>/dev/null || echo "파일 없음"

      - name: "[3] be_fixed 생성 관련 스크립트 탐색"
        run: |
          echo "=== be_fixed 관련 언급 파일 ==="
          grep -rn "be_fixed\|coc\|const_object_info" pio-tools/ 2>/dev/null || echo "없음"
          echo ""
          echo "=== solidify 관련 스크립트 ==="
          find . -name "*.py" | grep -v ".git\|.pio" | xargs grep -l "solidify\|be_fixed\|MI32\|USE_MI" 2>/dev/null | head -10

      - name: "[4] platformio_tasmota_env32.ini - bluetooth 섹션 상세"
        run: |
          echo "=== tasmota32-bluetooth 섹션 (224번 줄부터) ==="
          sed -n '220,260p' platformio_tasmota_env32.ini
          echo ""
          echo "=== esp32_defaults 섹션 ==="
          grep -A 20 "^\[esp32_defaults\]" platformio_tasmota32.ini | head -25
