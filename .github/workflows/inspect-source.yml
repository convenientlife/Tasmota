name: Inspect Source - BLE Berry Root Cause

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: "[0] 실제 파일 위치 탐색"
        run: |
          echo "=== be_modtab_tasmota.c 위치 ==="
          find . -name "be_modtab_tasmota.c" 2>/dev/null | grep -v ".git"

          echo ""
          echo "=== be_MI32_lib.c 위치 ==="
          find . -name "be_MI32_lib.c" 2>/dev/null | grep -v ".git"

          echo ""
          echo "=== berry_tasmota 폴더 위치 ==="
          find . -type d -name "berry_tasmota" 2>/dev/null | grep -v ".git"

          echo ""
          echo "=== lib 폴더 구조 (2단계) ==="
          find . -maxdepth 3 -type d | grep -v ".git\|.pio" | sort

          echo ""
          echo "=== BLE 관련 .c/.h 파일 전체 ==="
          find . -name "*BLE*" -o -name "*ble_esp32*" | grep -v ".git" | sort

          echo ""
          echo "=== MI32 관련 .c/.h 파일 ==="
          find . -name "*MI32*" | grep -v ".git" | sort

      - name: "[1] platformio 환경 파일 목록"
        run: |
          echo "=== 루트의 .ini 파일 ==="
          ls *.ini 2>/dev/null || echo "없음"
          echo ""
          echo "=== tasmota32-bluetooth 환경 정의 위치 ==="
          grep -rn "tasmota32-bluetooth" *.ini 2>/dev/null | head -20
