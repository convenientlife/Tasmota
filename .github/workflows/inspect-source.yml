name: Inspect Source - BLE Berry Root Cause

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: arendst/Tasmota
          ref: v14.6.0

      - name: "[1] coc.py (be_fixed 생성 도구) 위치 탐색"
        run: |
          echo "=== coc.py 탐색 ==="
          find . -name "coc.py" | grep -v ".git" || echo "없음"
          echo ""
          echo "=== tools 폴더 ==="
          ls tools/ 2>/dev/null || echo "없음"
          echo ""
          echo "=== extra_scripts (pre-build 스크립트) 위치 ==="
          grep -rn "extra_scripts\|coc\|be_fixed" platformio.ini platformio_tasmota*.ini 2>/dev/null | head -20

      - name: "[2] platformio_tasmota_env32.ini - tasmota32-bluetooth 전체 섹션"
        run: |
          awk '/^\[env:tasmota32-bluetooth\]/{found=1} found{print; if(/^\[/ && !/^\[env:tasmota32-bluetooth\]/) exit}' \
            platformio_tasmota_env32.ini

      - name: "[3] be_mapping.h 포함하는 헤더 체인"
        run: |
          echo "=== be_mapping.h include 내용 ==="
          find . -name "be_mapping.h" | grep -v ".git" | head -3 | while read f; do
            echo "파일: $f"
            grep "#include" "$f" | head -10
          done
          echo ""
          echo "=== be_constobj.h include 내용 ==="
          find . -name "be_constobj.h" | grep -v ".git" | head -3 | while read f; do
            echo "파일: $f"
            grep "#include" "$f" | head -10
          done

      - name: "[4] xdrv_52_3_berry_MI32.ino - 수정 대상 줄 확인"
        run: |
          F=tasmota/tasmota_xdrv_driver/xdrv_52_3_berry_MI32.ino
          echo "=== ifdef 조건 줄들 ==="
          grep -n "ifdef\|ifndef\|endif\|if defined" "$F"
          echo ""
          echo "=== 수정 대상 줄 (1~30줄) ==="
          head -30 "$F"
